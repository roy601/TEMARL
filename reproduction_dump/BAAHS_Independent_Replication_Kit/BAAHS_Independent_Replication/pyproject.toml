[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "baahs-independent-experiments"
version = "0.1.0"
description = "Independent BAAHS-style attacker honeypot placement simulator and honest evaluation harness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools]
packages = ["baahs"]
